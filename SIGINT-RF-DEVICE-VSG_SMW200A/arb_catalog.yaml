# ARB signal catalog for smw200a_arb_signals.py
#
# Each entry is: gen, carrier_mhz, power_dbm, description, trial_native.
# gen:          generator function name (registered in GEN_REGISTRY in the script).
# gen_kwargs:   optional dict of keyword args fixed via functools.partial.
# carrier_mhz:  RF carrier in MHz.
# power_dbm:    output power in dBm (conducted / shielded bench only).
# description:  short human-readable label.
# trial_native: which native SMW option could replicate this while trials are active
#               (informational; this script always uses the permanent ARB path).
#
# RF SAFETY: generate only in a shielded bench (cable + attenuator or screened chamber).
# Never radiate distress/safety frequencies (EPIRB 406 MHz, ELT 121.5 MHz, ADS-B 1090 MHz,
# maritime Ch16/Ch70, Mode S) outdoors.

signals:

  # ---------- VHF/UHF voice & data ----------
  atc_am:
    gen: gen_am_dsb
    carrier_mhz: 118.0
    power_dbm: -30
    description: "ATC voice AM-DSB"
    trial_native: "AM nativo K720 [T] (no usado aqui)"

  maritime_fm:
    gen: gen_fm
    carrier_mhz: 156.8
    power_dbm: -30
    description: "Maritime voice FM (Ch16)"
    trial_native: "FM nativo K720 [T] (no usado aqui)"

  noaa_fm:
    gen: gen_fm
    carrier_mhz: 162.4
    power_dbm: -30
    description: "NOAA WX FM"
    trial_native: "FM nativo K720 [T] (no usado aqui)"

  gmrs_fm:
    gen: gen_fm
    carrier_mhz: 462.5625
    power_dbm: -30
    description: "GMRS FM"
    trial_native: "FM nativo K720 [T] (no usado aqui)"

  ais:
    gen: gen_gmsk
    carrier_mhz: 161.975
    power_dbm: -40
    description: "AIS GMSK"
    trial_native: "Custom GMSK / ARB [P] - bits aleatorios (trama AIS real -> encoder externo)"

  dsc:
    gen: gen_fsk
    carrier_mhz: 156.525
    power_dbm: -40
    description: "DSC Ch70 FSK"
    trial_native: "Custom 2FSK / ARB [P]"

  dmr:
