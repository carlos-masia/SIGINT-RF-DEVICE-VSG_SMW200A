    carrier_mhz: 1575.42
    power_dbm: -60
    description: "GNSS L1 BPSK (1 SV placeholder)"
    trial_native: "Opciones GNSS K44/K66/K94/K107 [T]; ARB 1 SV limitado [P]"

  # ---------- S-band ----------
  ttc_sband:
